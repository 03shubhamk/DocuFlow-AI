global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "docuflow-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["docuflow-api:8000", "localhost:8000"]
        labels:
          app: "docuflow-ai"
          environment: "production"
