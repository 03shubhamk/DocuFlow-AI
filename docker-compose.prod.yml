version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. Relational Database: PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: docuflow-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docuflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be supplied in production environment}
      POSTGRES_DB: ${POSTGRES_DB:-docuflow_db}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docuflow} -d ${POSTGRES_DB:-docuflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "0.5"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - docuflow-prod-network

  # ----------------------------------------------------------------------------
  # 2. In-Memory Cache & Message Broker: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: docuflow-prod-redis
    restart: always
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - docuflow-prod-network

  # ----------------------------------------------------------------------------
  # 3. Vector Database: Qdrant
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: docuflow-prod-qdrant
    restart: always
    volumes:
      - prod_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M
        reservations:
          cpus: "1.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - docuflow-prod-network

  # ----------------------------------------------------------------------------
  # 4. S3 Object Storage: MinIO
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: docuflow-prod-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?MinIO access key must be provided in production}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?MinIO secret access key must be provided in production}
    volumes:
      - prod_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - docuflow-prod-network

  # ----------------------------------------------------------------------------
  # 5. One-Shot MinIO Production Bucket Creator
  # ----------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: docuflow-prod-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY};
      mc mb --ignore-existing local/${S3_BUCKET_DOCUMENTS:-docuflow-documents};
      exit 0;
      "
    networks:
      - docuflow-prod-network

  # ----------------------------------------------------------------------------
  # 6. Backend API Server: FastAPI (Production)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/03shubhamk/docuflow-ai/backend:latest
    container_name: docuflow-prod-backend
    restart: always
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DATABASE_URL: ${DATABASE_URL:?Production DATABASE_URL required}
      DATABASE_SYNC_URL: ${DATABASE_SYNC_URL:?Production DATABASE_SYNC_URL required}
      REDIS_URL: ${REDIS_URL:?Production REDIS_URL required}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-docuflow-documents}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Production JWT_SECRET_KEY must be provided}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "0.5"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - docuflow-prod-network

  # ----------------------------------------------------------------------------
  # 7. Celery Ingestion & Indexing Worker (Production)
  # ----------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/03shubhamk/docuflow-ai/backend:latest
    container_name: docuflow-prod-celery-worker
    restart: always
    command: ["celery", "-A", "app.infrastructure.tasks.celery_app", "worker", "-l", "info", "-Q", "docuflow.parsing,docuflow.indexing,celery", "--concurrency", "4", "--max-tasks-per-child", "100"]
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SYNC_URL: ${DATABASE_SYNC_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-docuflow-documents}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M
        reservations:
          cpus: "1.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - docuflow-prod-network

  # ----------------------------------------------------------------------------
  # 8. Celery Beat Scheduler (Periodic Maintenance & Log Archiving)
  # ----------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/03shubhamk/docuflow-ai/backend:latest
    container_name: docuflow-prod-celery-beat
    restart: always
    command: ["celery", "-A", "app.infrastructure.tasks.celery_app", "beat", "-l", "info"]
    environment:
      ENVIRONMENT: production
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - docuflow-prod-network

  # ----------------------------------------------------------------------------
  # 9. Frontend Web Application: Next.js (Production Standalone)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/03shubhamk/docuflow-ai/frontend:latest
    container_name: docuflow-prod-frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
        reservations:
          cpus: "0.2"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - docuflow-prod-network

# ------------------------------------------------------------------------------
# Persistent Named Volumes (Data persists across container restarts)
# ------------------------------------------------------------------------------
volumes:
  prod_postgres_data:
    name: docuflow_prod_postgres_data
  prod_redis_data:
    name: docuflow_prod_redis_data
  prod_qdrant_data:
    name: docuflow_prod_qdrant_data
  prod_minio_data:
    name: docuflow_prod_minio_data

# ------------------------------------------------------------------------------
# Isolated Production Network
# ------------------------------------------------------------------------------
networks:
  docuflow-prod-network:
    name: docuflow-prod-network
    driver: bridge
