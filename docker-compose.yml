version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # Relational Database: PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: docuflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docuflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docuflow_dev_secret_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-docuflow_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docuflow} -d ${POSTGRES_DB:-docuflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docuflow-network

  # ----------------------------------------------------------------------------
  # In-Memory Cache & Message Broker: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: docuflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - docuflow-network

  # ----------------------------------------------------------------------------
  # Vector Database: Qdrant
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: docuflow-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docuflow-network

  # ----------------------------------------------------------------------------
  # S3-Compatible Object Storage: MinIO
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: docuflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docuflow-network

  # ----------------------------------------------------------------------------
  # One-Shot MinIO Bucket Initializer
  # ----------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: docuflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET_DOCUMENTS:-docuflow-documents};
      exit 0;
      "
    networks:
      - docuflow-network

  # ----------------------------------------------------------------------------
  # Backend API Server: FastAPI (Modular Monolith)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuflow-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://docuflow:docuflow_dev_secret_change_in_prod@postgres:5432/docuflow_db}
      DATABASE_SYNC_URL: ${DATABASE_SYNC_URL:-postgresql://docuflow:docuflow_dev_secret_change_in_prod@postgres:5432/docuflow_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-docuflow-documents}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_insecure_jwt_secret_key_change_in_production_min_32_chars!}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - docuflow-network

  # ----------------------------------------------------------------------------
  # Celery Ingestion Worker
  # ----------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuflow-celery-worker
    restart: unless-stopped
    command: celery -A app.infrastructure.tasks.celery_app worker -l info -Q docuflow.parsing,docuflow.indexing,celery
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://docuflow:docuflow_dev_secret_change_in_prod@postgres:5432/docuflow_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-docuflow-documents}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - docuflow-network

  # ----------------------------------------------------------------------------
  # Frontend Web Dashboard: Next.js
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docuflow-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - docuflow-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:

networks:
  docuflow-network:
    driver: bridge
