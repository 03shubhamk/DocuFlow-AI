name: DocuFlow AI — Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ============================================================================
  # 1. Backend CI (Lint, Format, Type Check, Alembic, Pytest Coverage)
  # ============================================================================
  backend-ci:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff Format Check
        run: ruff format --check app tests

      - name: Ruff Lint Check
        run: ruff check app tests

      - name: Mypy Static Type Analysis
        run: mypy app

      - name: Alembic Migration Dry-Run Check
        run: alembic upgrade head --sql

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 14

  # ============================================================================
  # 2. Frontend CI (Lint, Type Check, Vitest Unit Tests, Next.js Production Build)
  # ============================================================================
  frontend-ci:
    name: Frontend CI (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint Check
        run: npm run lint

      - name: TypeScript Compiler Check
        run: npx tsc --noEmit

      - name: Vitest Unit & Component Tests
        run: npm test

      - name: Build Next.js Production Bundle
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api/v1"
        run: npm run build

      - name: Upload Frontend Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-next-bundle
          path: frontend/.next/standalone
          retention-days: 7

  # ============================================================================
  # 3. Security & Dependency Vulnerability Audits
  # ============================================================================
  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Python Dependency Security Audit (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt || echo "pip-audit completed with warnings"

      - name: Node.js Security Audit (npm audit)
        working-directory: ./frontend
        run: |
          npm audit --audit-level=high || echo "npm audit completed with advisories"

      - name: Trivy Repository Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0"

  # ============================================================================
  # 4. Docker Build & Multi-Stage Validation
  # ============================================================================
  docker-validation:
    name: Docker Images Build Validation
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image (Validation Only)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: docuflow-backend:test-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image (Validation Only)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: docuflow-frontend:test-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
