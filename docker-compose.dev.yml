version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 (Development)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: docuflow-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docuflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docuflow_dev_secret_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-docuflow_db}
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docuflow} -d ${POSTGRES_DB:-docuflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docuflow-dev-network

  # ----------------------------------------------------------------------------
  # Redis 7 (Development Cache & Message Broker)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: docuflow-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - docuflow-dev-network

  # ----------------------------------------------------------------------------
  # Qdrant Vector Database (Development)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: docuflow-dev-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - dev_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docuflow-dev-network

  # ----------------------------------------------------------------------------
  # MinIO Object Storage (Development)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: docuflow-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dev_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docuflow-dev-network

  # ----------------------------------------------------------------------------
  # MinIO Auto-Bucket Creator (Development Init)
  # ----------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: docuflow-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET_DOCUMENTS:-docuflow-documents};
      exit 0;
      "
    networks:
      - docuflow-dev-network

  # ----------------------------------------------------------------------------
  # Backend API Server (Development with Hot Reloading)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuflow-dev-backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug"]
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://docuflow:docuflow_dev_secret_change_in_prod@postgres:5432/docuflow_db}
      DATABASE_SYNC_URL: ${DATABASE_SYNC_URL:-postgresql://docuflow:docuflow_dev_secret_change_in_prod@postgres:5432/docuflow_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-docuflow-documents}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_insecure_jwt_secret_key_change_in_production_min_32_chars!}
    volumes:
      - ./backend/app:/app/app:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - docuflow-dev-network

  # ----------------------------------------------------------------------------
  # Celery Ingestion & Indexing Worker (Development)
  # ----------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuflow-dev-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.infrastructure.tasks.celery_app", "worker", "-l", "debug", "-Q", "docuflow.parsing,docuflow.indexing,celery", "--concurrency", "2"]
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://docuflow:docuflow_dev_secret_change_in_prod@postgres:5432/docuflow_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-docuflow-documents}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - docuflow-dev-network

  # ----------------------------------------------------------------------------
  # Frontend Web Dashboard (Development with Fast Refresh)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docuflow-dev-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - docuflow-dev-network

volumes:
  dev_postgres_data:
  dev_redis_data:
  dev_qdrant_data:
  dev_minio_data:

networks:
  docuflow-dev-network:
    driver: bridge
