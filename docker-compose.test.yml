version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL (Test Database Instance)
  # ----------------------------------------------------------------------------
  postgres-test:
    image: postgres:16-alpine
    container_name: docuflow-test-postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: docuflow_test_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d docuflow_test_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - docuflow-test-network

  # ----------------------------------------------------------------------------
  # Redis (Test Broker Instance)
  # ----------------------------------------------------------------------------
  redis-test:
    image: redis:7.2-alpine
    container_name: docuflow-test-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - docuflow-test-network

  # ----------------------------------------------------------------------------
  # Qdrant (Test Vector DB Instance)
  # ----------------------------------------------------------------------------
  qdrant-test:
    image: qdrant/qdrant:v1.9.7
    container_name: docuflow-test-qdrant
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - docuflow-test-network

  # ----------------------------------------------------------------------------
  # MinIO (Test S3 Storage Instance)
  # ----------------------------------------------------------------------------
  minio-test:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: docuflow-test-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: test_minio_admin
      MINIO_ROOT_PASSWORD: test_minio_password
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - docuflow-test-network

  # ----------------------------------------------------------------------------
  # Backend Test Runner
  # ----------------------------------------------------------------------------
  backend-test-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuflow-backend-test-runner
    environment:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@postgres-test:5432/docuflow_test_db
      DATABASE_SYNC_URL: postgresql://test_user:test_password@postgres-test:5432/docuflow_test_db
      REDIS_URL: redis://redis-test:6379/0
      CELERY_RESULT_BACKEND: redis://redis-test:6379/1
      S3_ENDPOINT_URL: http://minio-test:9000
      S3_ACCESS_KEY_ID: test_minio_admin
      S3_SECRET_ACCESS_KEY: test_minio_password
      S3_BUCKET_DOCUMENTS: docuflow-test-bucket
      QDRANT_HOST: qdrant-test
      QDRANT_PORT: 6333
      JWT_SECRET_KEY: test_secret_key_minimum_32_characters_long_for_security!
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      qdrant-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
    command: ["pytest", "tests", "-v", "--cov=app"]
    networks:
      - docuflow-test-network

  # ----------------------------------------------------------------------------
  # Frontend Test Runner
  # ----------------------------------------------------------------------------
  frontend-test-runner:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docuflow-frontend-test-runner
    command: ["npm", "test"]
    networks:
      - docuflow-test-network

networks:
  docuflow-test-network:
    driver: bridge
